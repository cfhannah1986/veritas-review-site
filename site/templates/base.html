<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="google-site-verification" content="KIj0-TBhNq0wh-Rf3gCD23C3WnIpEcRWfX-eJxpt6Pk">
<title>{{title}} · {{brand}}</title>
<meta name="description" content="{{description}}">
<meta property="og:type" content="website">
<meta property="og:site_name" content="{{brand}}">
<meta property="og:title" content="{{title}} · {{brand}}">
<meta property="og:description" content="{{description}}">
<meta property="og:url" content="{{site_url}}{{page_url}}">
<meta property="og:image" content="{{site_url}}/static/brand/veritas-logo-full.jpg">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{title}} · {{brand}}">
<meta name="twitter:description" content="{{description}}">
<meta name="twitter:image" content="{{site_url}}/static/brand/veritas-logo-full.jpg">
<link rel="stylesheet" href="/static/style.css">
<link rel="icon" type="image/png" href="/static/brand/favicon-32.png">
{{adsense_head}}
</head>
<body>
<header class="site-header">
  <div class="wrap header-inner">
    <a class="brand" href="/"><img class="brand-logo" src="/static/brand/veritas-flame.png" alt="">{{brand}}</a>
    <nav class="main-nav">{{nav}}</nav>
  </div>
</header>
<main class="wrap">
{{content}}
</main>
<footer class="site-footer">
  <div class="wrap footer-inner">
    <div>
      <strong>{{brand}}</strong><br>
      <span class="muted"><img src="/static/brand/glowpress-mark.png" alt="GlowPress" class="gp-mark" /> A <a href="https://glowpress.app">GlowPress</a> service.</span>
    </div>
    <nav class="foot-nav">
      <a href="/about.html">About</a>
      <a href="/contact.html">Contact</a>
      <a href="/privacy.html">Privacy</a>
      <a href="/terms.html">Terms</a>
    </nav>
  </div>
  <div class="wrap tiny muted">© {{year}} {{brand}}. All rights reserved.</div>
</footer>
<script>
if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
  document.querySelectorAll('video[autoplay]').forEach(function (v) { v.pause(); });
}
</script>
</body>
</html>
